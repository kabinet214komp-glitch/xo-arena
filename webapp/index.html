<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>XO Arena</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <header class="header">

        <div class="logo">
            <span class="logo-x">X</span>
            <span class="logo-o">O</span>
        </div>

        <div>
            <h1>XO ARENA</h1>
            <p>Battle of 3</p>
        </div>

    </header>


    <!-- PLAYER -->

    <section class="player-card">

        <div class="avatar" id="avatar">
            ?
        </div>

        <div class="player-info">
            <span class="player-name" id="playerName">
                Player
            </span>

            <span class="player-role">
                ❌ Твой символ
            </span>
        </div>

        <div class="score">
            <span>🏆</span>
            <strong id="score">0</strong>
        </div>

    </section>


    <!-- STATUS -->

    <div class="status" id="status">
        Твой ход ⚡
    </div>


    <!-- BOARD -->

    <main class="board" id="board">

        <button class="cell" data-index="0"></button>
        <button class="cell" data-index="1"></button>
        <button class="cell" data-index="2"></button>

        <button class="cell" data-index="3"></button>
        <button class="cell" data-index="4"></button>
        <button class="cell" data-index="5"></button>

        <button class="cell" data-index="6"></button>
        <button class="cell" data-index="7"></button>
        <button class="cell" data-index="8"></button>

    </main>


    <!-- PIECES -->

    <div class="pieces-info">

        <div>
            <span class="dot x-dot"></span>
            <span>Твои фигуры</span>
        </div>

        <div>
            <span id="pieceCount">0 / 3</span>
        </div>

    </div>


    <!-- RESTART -->

    <button class="restart" id="restart">
        🔄 Новая игра
    </button>


</div>


<!-- WIN SCREEN -->

<div class="overlay hidden" id="winScreen">

    <div class="win-card">

        <div class="trophy">
            🏆
        </div>

        <h2 id="winTitle">
            ПОБЕДА!
        </h2>

        <p id="winText">
            Три в ряд!
        </p>

        <button id="playAgain">
            🎮 Играть снова
        </button>

    </div>

</div>


<script src="app.js"></script>

</body>
</html>
